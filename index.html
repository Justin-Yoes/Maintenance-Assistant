<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Maintenance Work Order Assistant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
    }

    #chat {
      border: 1px solid #ccc;
      height: 500px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 15px;
      background: #fafafa;
    }

    .message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
    }

    .user {
      background-color: #d9ecff;
    }

    .assistant {
      background-color: #e8e8e8;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .reset-btn {
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Maintenance Work Order Assistant</h1>

    <div id="chat"></div>

    <div class="input-area">
      <input
        id="input"
        type="text"
        placeholder="Describe the issue or answer the question..."
      />

      <button onclick="sendMessage()">Send</button>
    </div>

    <button class="reset-btn" onclick="resetConversation()">
      Start New Work Order
    </button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    function addMessage(sender, text) {
      const div = document.createElement("div");

      div.classList.add("message");

      if (sender === "You") {
        div.classList.add("user");
      } else {
        div.classList.add("assistant");
      }

      div.innerHTML = "<strong>" + sender + ":</strong><br>" + text;

      chat.appendChild(div);

      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message) return;

      addMessage("You", message);

      input.value = "";

      const response = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message
        })
      });

      const data = await response.json();

      addMessage("Assistant", data.reply);
    }

    function resetConversation() {
      location.reload();
    }

    input.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    addMessage(
      "Assistant",
      "Describe the machine issue to begin creating a work order."
    );
  </script>

</body>
</html>
